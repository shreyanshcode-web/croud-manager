<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO & Social -->
    <title>SV-Companion — Your Event Assistant</title>
    <meta name="description" content="Real-time AI-powered event companion. Find shortest queues, navigate the venue, plan your exit, and get personalized advice — all in one app." />
    <meta name="theme-color" content="#0C0E14" />

    <!-- PWA / Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SV-Companion" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA Manifest — enables "Add to Home Screen" install on Android/iOS -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Google Fonts (Inter + JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Google Analytics 4 — Google Service -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '%VITE_GA_MEASUREMENT_ID%', {
        app_name: 'SV-Companion',
        send_page_view: false  // We send manually per-tab for SPA accuracy
      });
    </script>

    <!-- Google Identity Services — Google Service -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Google Maps JavaScript API — Google Service (loaded in NavigateTab) -->
    <!-- Key injected at runtime via VITE_GOOGLE_MAPS_API_KEY -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
